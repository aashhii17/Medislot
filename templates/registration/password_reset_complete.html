{% extends "base.html" %}
{% block title %}Password Updated · MediSlot{% endblock %}
{% block content %}
<div class="min-h-[70vh] relative flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 overflow-hidden text-stone-850">
  <!-- Decorative colored glow background -->
  <div class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-amber-500/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    <div class="bg-white p-8 rounded-[36px] border border-stone-200 shadow-xl space-y-6 text-center">
      <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center font-bold text-2xl mx-auto">
        ✓
      </div>
      <div class="space-y-2">
        <h2 class="text-3xl font-extrabold tracking-tight text-stone-900">
          Password Updated!
        </h2>
        <p class="text-sm text-stone-500 leading-relaxed">
          Your password has been successfully updated. You can now use your new password to sign in.
        </p>
      </div>

      <div class="pt-4 border-t border-stone-100">
        <a 
          href="{% url 'login' %}"
          class="w-full inline-flex items-center justify-center h-11 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold rounded-xl shadow-lg shadow-amber-500/10 hover:opacity-95 transition-all text-sm"
        >
          Sign In
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
